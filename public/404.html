<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirection — Portfolio d’Enzo Castetbon</title>
    <script>
      (function (location) {
        var pathSegmentsToKeep = 1;
        var repositoryRoot = location.pathname
          .split("/")
          .slice(0, pathSegmentsToKeep + 1)
          .join("/");
        var route = location.pathname
          .split("/")
          .slice(pathSegmentsToKeep + 1)
          .join("/")
          .replace(/&/g, "~and~");
        var query = location.search
          ? "&" + location.search.slice(1).replace(/&/g, "~and~")
          : "";

        location.replace(
          location.protocol +
            "//" +
            location.host +
            repositoryRoot +
            "/?/" +
            route +
            query +
            location.hash
        );
      })(window.location);
    </script>
  </head>
  <body>
    <noscript>
      JavaScript est nécessaire pour rediriger vers le portfolio.
    </noscript>
  </body>
</html>
